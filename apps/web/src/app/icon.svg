<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Monitoring Stasiun Cuaca">
  <!--
    Favicon: awan yang sedang memancarkan sinyal.

    Dua unsur yang harus terbaca di ukuran 16 piksel: CUACA (awan + matahari)
    dan TRANSMISI (gelombang radio). Kombinasi itulah yang membedakan aplikasi
    ini dari aplikasi ramalan cuaca biasa - datanya dikirim perangkat di
    lapangan, bukan diambil dari layanan orang lain.

    Bentuknya sengaja tebal dan sedikit: detail halus hilang sama sekali di
    ukuran tab browser. Warnanya mengikuti palet dashboard - langit biru dan
    matahari amber.

    Next.js App Router otomatis menjadikan src/app/icon.svg sebagai favicon,
    tanpa perlu tag <link> di layout.
  -->
  <rect width="32" height="32" rx="7" fill="#0f172a" />

  <!-- Matahari, mengintip di balik awan -->
  <circle cx="21" cy="11" r="4.2" fill="#f59e0b" />

  <!-- Awan -->
  <path
    d="M10.5 21.5a4.5 4.5 0 0 1 .3-8.99 6 6 0 0 1 11.42 1.6A3.9 3.9 0 0 1 21.6 21.5z"
    fill="#e2e8f0"
  />

  <!-- Gelombang sinyal yang memancar dari awan -->
  <g fill="none" stroke="#38bdf8" stroke-width="1.9" stroke-linecap="round">
    <path d="M13 25.4a5 5 0 0 1 6 0" />
    <path d="M10.4 28.2a9 9 0 0 1 11.2 0" />
  </g>
</svg>
