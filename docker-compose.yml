# ============================================================
# Seluruh stack dijalankan dengan satu perintah:
#
#   cp .env.example .env && docker compose up --build
#
# Service:
#   db   - TimescaleDB (PostgreSQL 16 + extension timescaledb)
#   api  - Backend NestJS. Menjalankan migrasi + seeder saat start.
#   web  - Frontend Next.js.
#   sim  - Device simulator (profile "sim", lihat README).
# ============================================================

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: weather_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Container database dijalankan dalam UTC agar now() dan default timestamp
      # tidak pernah bergantung pada timezone mesin yang menjalankannya.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # api menunggu healthcheck ini lulus sebelum menjalankan migrasi,
      # sehingga "docker compose up" tidak gagal karena race condition.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: weather_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: UTC
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      API_PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      DEVICE_KEY_PEPPER: ${DEVICE_KEY_PEPPER}
      DISPLAY_TZ: ${DISPLAY_TZ:-Asia/Jakarta}
      CLOCK_DRIFT_TOLERANCE_SECONDS: ${CLOCK_DRIFT_TOLERANCE_SECONDS:-300}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-500}
      INGEST_RATE_LIMIT_PER_MINUTE: ${INGEST_RATE_LIMIT_PER_MINUTE:-120}
      DEVICE_OFFLINE_THRESHOLD_MINUTES: ${DEVICE_OFFLINE_THRESHOLD_MINUTES:-15}
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Next.js membakar NEXT_PUBLIC_* saat build, bukan saat run, sehingga
        # nilainya harus masuk sebagai build arg.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
        NEXT_PUBLIC_DISPLAY_TZ: ${NEXT_PUBLIC_DISPLAY_TZ:-Asia/Jakarta}
    container_name: weather_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      TZ: UTC
    ports:
      - "${WEB_PORT:-3000}:3000"

  # Simulator tidak ikut naik secara default agar reviewer melihat data seeder
  # yang deterministik lebih dulu. Jalankan dengan:
  #   docker compose --profile sim up sim
  sim:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: weather_sim
    profiles: ["sim"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: UTC
      SIMULATOR_API_BASE_URL: http://api:3001
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-60}
    command: ["node", "tools/simulator/simulator.js", "--scenario", "normal"]

volumes:
  db_data:
